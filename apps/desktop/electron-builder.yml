appId: dev.localgg.app
productName: localGG
directories:
  output: release
files:
  - out/**
  - package.json
mac:
  category: public.app-category.games
  target:
    - { target: dmg, arch: [arm64, x64] }
    - { target: zip, arch: [arm64, x64] }
  # Unsigned for now (no Apple Developer ID yet). macOS cannot auto-update unsigned apps.
  identity: null
win:
  target:
    - { target: nsis, arch: [x64] }
nsis:
  oneClick: true
  perMachine: false
publish:
  provider: github
  owner: PauloGuti
  repo: localGG
