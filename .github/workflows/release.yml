name: Release
# Push a tag like v0.1.0 to build installers for macOS and Windows and publish them
# as a GitHub Release. The app updates itself from those releases.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build and publish
        working-directory: apps/desktop
        run: pnpm run release
        env:
          # Built-in, short-lived token of the workflow. No personal token needed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
